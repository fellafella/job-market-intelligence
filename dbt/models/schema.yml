version: 2

seeds:
  - name: skills
    description: Référentiel des compétences recherchées (nom, catégorie, motif de détection).
    columns:
      - name: skill_name
        data_tests: [unique, not_null]
      - name: term
        data_tests: [not_null]

models:
  - name: stg_jobs
    description: Offres dédupliquées (dernière version), JSON déplié, salaire analysé.
    columns:
      - name: job_key
        data_tests: [unique, not_null]
      - name: title
        data_tests: [not_null]
      - name: company_name
        data_tests: [not_null]
      - name: published_at
        data_tests: [not_null]
      - name: role_family
        data_tests:
          - accepted_values:
              values: ['Data Engineer', 'Data Analyst', 'Data Scientist',
                       'Analytics Engineer', 'ML / AI Engineer', 'Other']
      - name: seniority
        data_tests:
          - accepted_values:
              values: ['Junior', 'Mid', 'Senior', 'Lead+']

  - name: dim_company
    description: Dimension entreprise (une ligne par entreprise).
    columns:
      - name: company_id
        data_tests: [unique, not_null]

  - name: fct_job_postings
    description: Table de faits des offres, au grain "une offre".
    columns:
      - name: job_key
        data_tests: [unique, not_null]
      - name: company_id
        data_tests:
          - not_null
          - relationships:
              to: ref('dim_company')
              field: company_id
      - name: salary_currency
        data_tests:
          - accepted_values:
              values: ['USD', 'EUR', 'GBP']

  - name: fct_job_skills
    description: Table de faits "compétence demandée par offre".
    columns:
      - name: job_key
        data_tests:
          - not_null
          - relationships:
              to: ref('fct_job_postings')
              field: job_key
      - name: skill_name
        data_tests: [not_null]

  - name: mart_skill_demand
    description: Demande par compétence, famille de métier et mois.
    columns:
      - name: pct_of_postings
        data_tests: [not_null]

  - name: mart_salary_summary
    description: Salaires annoncés par métier, séniorité et devise.

  - name: mart_postings_trend
    description: Nombre d'offres publiées par jour et par famille de métier.
