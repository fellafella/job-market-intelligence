name: job-market-intelligence

# Variables de connexion à l'entrepôt, partagées par Airflow et le dashboard
x-warehouse-env: &warehouse-env
  WAREHOUSE_HOST: postgres
  WAREHOUSE_PORT: "5432"
  WAREHOUSE_DB: ${POSTGRES_DB:-warehouse}
  WAREHOUSE_USER: ${POSTGRES_USER:-jobs}
  WAREHOUSE_PASSWORD: ${POSTGRES_PASSWORD:-jobs}

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-jobs}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-jobs}
      POSTGRES_DB: ${POSTGRES_DB:-warehouse}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-jobs} -d ${POSTGRES_DB:-warehouse}"]
      interval: 5s
      timeout: 5s
      retries: 10

  airflow:
    build: ./docker/airflow
    user: "${AIRFLOW_UID:-50000}:0"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      <<: *warehouse-env
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER:-jobs}:${POSTGRES_PASSWORD:-jobs}@postgres:5432/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"
      AIRFLOW_USER: ${AIRFLOW_USER:-admin}
      AIRFLOW_PASSWORD: ${AIRFLOW_PASSWORD:-admin}
      PYTHONPATH: /opt/airflow/src
      DBT_PROJECT_DIR: /opt/airflow/dbt
      DBT_PROFILES_DIR: /opt/airflow/dbt
      DBT_TARGET_PATH: /tmp/dbt/target
      DBT_LOG_PATH: /tmp/dbt/logs
      RAW_DATA_DIR: /opt/airflow/data/raw
      JOBS_CATEGORIES: ${JOBS_CATEGORIES:-data}
      # true = utilise data/sample_jobs.json au lieu de l'API (démo hors-ligne)
      USE_SAMPLE_DATA: ${USE_SAMPLE_DATA:-false}
    volumes:
      - ./dags:/opt/airflow/dags
      - ./src:/opt/airflow/src
      - ./dbt:/opt/airflow/dbt
      - ./data:/opt/airflow/data
    ports:
      - "8080:8080"

  dashboard:
    build: ./dashboard
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      <<: *warehouse-env
    volumes:
      - ./dashboard:/app
    ports:
      - "8501:8501"

volumes:
  pgdata:
